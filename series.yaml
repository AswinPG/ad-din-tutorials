# Series configuration: parts, tracks, languages, playlists and open decisions.
# Per-video details live in videos/<track>/<video>/script.md, not here.
# Track defaults apply to every video in the track unless its script.md overrides them.

title: Ad-Din Tutorial Series
rules:
  max_length: "10:00"  # 2026-11-17 Imran: more detail, under 10 minutes (was 5:00)
  english_target: "8:30"
  note: English is timed to leave room for longer translations; every language must fit the same picture.
app:
  # Where scripts' labels are checked (npm run labels). Read-only; exported into out/app-src/<sha>.
  repo: C:/Fantacode/Ad-Din Web-master
  ref: origin/master
  src: AdDin.Angular/src
# Azure Speech in Foundry: the fallback narrator if the cloned voice (IP3-A) can't be made to sound natural (Imran,
# 2026-11-17). Used only with --engine azure (engine/voice.mjs, npm run say). Brian HD is the natural ("HD") version of
# the series voice and is multilingual; check what the resource offers with: python engine/azure_tts.py --voices en-US
azure:
  voice: en-US-Brian:DragonHDLatestNeural
  rate: ""            # e.g. "-4%"; empty = the voice's own pace
  locales: { en: en-US, ar: ar-SA, ur: ur-PK, bn: bn-BD, ms: ms-MY, id: id-ID }
# Exact sounds (IPA) for the voices that accept them (Kokoro now; Azure via <phoneme> later). Chosen by Imran by ear
# on 2026-11-17 from his recording "How to pronounce key words - correction": short vowels, no English "a" as in "cat".
# Ad-Din = "ud din" with a short i and a small break; masjid = "musjid"; madrasah = "MUD-rasa". Matching is
# case-insensitive and whole-word; plurals are listed separately. Voices without IPA input keep using pronunciations.
ipa:
  en:
    Ad-Din: ʌd dˈɪn
    masjid: mˈʌsdʒɪd
    masjids: mˈʌsdʒɪdz
    masajid: mˈʌsadʒɪd
    madrasah: mˈʌdɾasa
    madrasahs: mˈʌdɾasaz
    madrasa: mˈʌdɾasa
    Madressah: mˈʌdɾasa
    madaris: mˈadaɾis
languages:
  # One multilingual voice narrates every language: William (2026-11-03), then Brian (2026-11-04). To switch a language
  # back to its native voice, replace its voice with the one in its comment.
  # 2026-11-05 Imran chose his own cloned voice "IP3-A" for the recorded videos (English): Chatterbox Multilingual,
  # reference C:/Fantacode/voice-clone/voices/ip3.wav (Ad-Din promo, 15-29 s), settings exaggeration 0.7, cfg 0.3,
  # temperature 0.9, every line checked by speech-to-text (voice-clone/batch_clone.py). Chatterbox covers en, ar, ms only;
  # ur, bn and id stay on Brian until decided. Other cloned voices: IP2 = cleaned WhatsApp note (2026-10-31).
  - code: en
    name: English
    priority: 1
    voice: en-US-BrianMultilingualNeural  # native option: en-GB-RyanNeural
    markets:
      - UK
      - USA
      - Canada
      - Australia
      - UAE
    source: true
  - code: ar
    name: Arabic
    priority: 2
    voice: en-US-BrianMultilingualNeural  # native option: ar-SA-HamedNeural
    markets:
      - UAE
      - Saudi Arabia
      - Qatar
      - Kuwait
      - Bahrain
    rtl: true
    note: Modern Standard Arabic, one Gulf voice for all five markets
  - code: ur
    name: Urdu
    priority: 3
    voice: en-US-BrianMultilingualNeural  # native option: ur-PK-AsadNeural
    markets:
      - Pakistan
      - UK
      - USA
      - Canada
      - UAE
    rtl: true
  - code: bn
    name: Bangla (Bengali)
    priority: 4
    voice: en-US-BrianMultilingualNeural  # native option: bn-BD-PradeepNeural
    markets:
      - Bangladesh
      - UK
      - Canada
      - UAE
  - code: ms
    name: Malay
    priority: 5
    voice: en-US-BrianMultilingualNeural  # native option: ms-MY-OsmanNeural
    markets:
      - Malaysia
      - Brunei
      - Singapore
  - code: id
    name: Indonesian
    priority: 6
    voice: en-US-BrianMultilingualNeural  # native option: id-ID-ArdiNeural
    markets:
      - Indonesia
