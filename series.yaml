decisions:
  - title: Is Staff Attendance live?
    detail: The Oct 3 handover note says the pilot hadn’t run in UAT or production. Confirm before Track 13 goes public.
    videos: 13.1–13.8
    status: open
  - title: Who needs a seat?
    detail: The madrasah admin page guard checks the user’s own Premium, not the organisation’s seats. Decide what’s intended before scripting.
    videos: "02.4"
    status: open
  - title: First billing setup for a new organisation
    detail: How a brand-new organisation gets its billing account isn’t clear from the code. Walk it on dev first.
    videos: "02.3"
    status: open
  - title: People are added by GUID
    detail: There are no email invites, so videos teach how to find and share your GUID.
    videos: 00.5, 03.3, 03.4
    status: open
  - title: Sign-up page links
    detail: The Terms of Service and Privacy Policy links go nowhere. Fix them or avoid zooming in.
    videos: "00.2"
    status: open
  - title: Exam Marks
    detail: The older feature, off by default; the Services tab recommends Academic Activity instead. Keep or drop?
    videos: "10.11"
    status: open
  - title: No online fee payment for parents
    detail: PayPal keys exist but parents have no pay button, so 14.4 shows invoice history only.
    videos: "14.4"
    status: open
  - title: Left out on purpose
    detail: Carpool (switched off), social login (no buttons), Ideas (app feedback), the unused clock-in placeholder, the old teacher-attendance register.
    videos: —
    status: open
