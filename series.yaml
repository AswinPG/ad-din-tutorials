# Series configuration: parts, tracks, languages, playlists and open decisions.
# Per-video details live in videos/<track>/<video>/script.md, not here.
# Track defaults apply to every video in the track unless its script.md overrides them.

title: Ad-Din Tutorial Series
rules:
  max_length: 5:00
  english_target: 4:15
  note: English is timed to leave room for longer translations; every language must fit the same picture.
languages:
  # One multilingual voice (William) narrates every language (decided 2026-11-03). To switch a language
  # back to its native voice, replace its voice with the one in its comment.
  - code: en
    name: English
    priority: 1
    voice: en-AU-WilliamMultilingualNeural  # native option: en-GB-RyanNeural
    markets:
      - UK
      - USA
      - Canada
      - Australia
      - UAE
    source: true
  - code: ar
    name: Arabic
    priority: 2
    voice: en-AU-WilliamMultilingualNeural  # native option: ar-SA-HamedNeural
    markets:
      - UAE
      - Saudi Arabia
      - Qatar
      - Kuwait
      - Bahrain
    rtl: true
    note: Modern Standard Arabic, one Gulf voice for all five markets
  - code: ur
    name: Urdu
    priority: 3
    voice: en-AU-WilliamMultilingualNeural  # native option: ur-PK-AsadNeural
    markets:
      - Pakistan
      - UK
      - USA
      - Canada
      - UAE
    rtl: true
  - code: bn
    name: Bangla (Bengali)
    priority: 4
    voice: en-AU-WilliamMultilingualNeural  # native option: bn-BD-PradeepNeural
    markets:
      - Bangladesh
      - UK
      - Canada
      - UAE
  - code: ms
    name: Malay
    priority: 5
    voice: en-AU-WilliamMultilingualNeural  # native option: ms-MY-OsmanNeural
    markets:
      - Malaysia
      - Brunei
      - Singapore
  - code: id
    name: Indonesian
    priority: 6
    voice: en-AU-WilliamMultilingualNeural  # native option: id-ID-ArdiNeural
    markets:
      - Indonesia
pronunciations:
  # How the voice should say a word, per language. Keys are matched as whole words, case-insensitive.
  # Values are respellings sent to the voice only; subtitles and scripts keep the proper spelling.
  # Fill these in from the agreed pronunciations, then preview with: npm run say -- "<sentence>"
  en:
    Masjid: Masjid
    Madrasah: Madrasah
    Masaajid: Masaajid
    Madaris: Madaris
    Ad-Din: Ad-Din
statuses:
  - planned
  - scripted
  - script-approved
  - recorded
  - video-approved
  - client-approved
  - published
  - on-hold
