    name: Start here
    sub: Account and first steps
  - id: B
    name: Register & subscribe
    sub: Organisation and plans
  - id: C
    name: Set up your organisation
    sub: One-time configuration
  - id: D
    name: Use it every day
    sub: Routine work
  - id: E
    name: End of term & year
    sub: Periodic jobs
